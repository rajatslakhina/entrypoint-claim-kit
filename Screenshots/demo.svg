<text x="20" y="472" fill="#93c5fd" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">[4]&#160;A&#160;shell-form&#160;ENTRYPOINT&#160;never&#160;sees&#160;CMD&#160;(one&#160;mistake,&#160;one&#160;finding)</text>
