<text x="20" y="1012" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;XX&#160;`docker&#160;run&#160;api&#160;--debug`&#160;does&#160;not&#160;run&#160;`python&#160;app.py&#160;--port&#160;80&#160;--debug`:&#160;it&#160;runs&#160;`python&#160;app.py&#160;--debug`&#160;(arguments&#160;after&#160;the&#160;image&#160;replace&#160;CMD;&#160;they</text>
<text x="20" y="1030" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;are&#160;not&#160;added&#160;to&#160;it).</text>
<text x="20" y="1048" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;turn&#160;2:&#160;wrong&#160;(1&#160;claim&#160;checked,&#160;0&#160;hold,&#160;1&#160;wrong,&#160;1&#160;repeated)</text>
<text x="20" y="1066" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;XX&#160;`docker&#160;run&#160;api&#160;--debug`&#160;does&#160;not&#160;run&#160;`python&#160;app.py&#160;--port&#160;80&#160;--debug`:&#160;it&#160;runs&#160;`python&#160;app.py&#160;--debug`&#160;(arguments&#160;after&#160;the&#160;image&#160;replace&#160;CMD;&#160;they</text>
<text x="20" y="1084" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;are&#160;not&#160;added&#160;to&#160;it).&#160;[repeated]</text>
