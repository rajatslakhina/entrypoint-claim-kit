<text x="20" y="616" fill="#93c5fd" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">[5]&#160;Single&#160;quotes&#160;are&#160;not&#160;JSON:&#160;the&#160;exec&#160;form&#160;silently&#160;becomes&#160;the&#160;shell&#160;form</text>
<text x="20" y="634" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;answer:&#160;wrong&#160;(2&#160;claims&#160;checked,&#160;0&#160;hold,&#160;2&#160;wrong)</text>
<text x="20" y="652" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;XX&#160;Starting&#160;the&#160;container&#160;does&#160;not&#160;run&#160;`node&#160;server.js`:&#160;it&#160;runs&#160;`/bin/sh&#160;-c&#160;&quot;['node',&#160;'server.js']&quot;`&#160;after&#160;the&#160;base&#160;image's&#160;ENTRYPOINT,&#160;if&#160;any&#160;(the</text>
<text x="20" y="670" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;array&#160;is&#160;not&#160;JSON,&#160;because&#160;of&#160;single&#160;quotes&#160;or&#160;a&#160;trailing&#160;comma,&#160;so&#160;Docker&#160;runs&#160;it&#160;as&#160;shell-form&#160;text).</text>
<text x="20" y="688" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;XX&#160;The&#160;exec&#160;form&#160;is&#160;JSON&#160;and&#160;needs&#160;double&#160;quotes:&#160;with&#160;single&#160;quotes&#160;Docker&#160;runs&#160;the&#160;text&#160;through&#160;the&#160;shell,&#160;which&#160;fails&#160;to&#160;find&#160;a&#160;command&#160;named&#160;like</text>
<text x="20" y="706" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;the&#160;array.</text>
<text x="20" y="724" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal"></text>
<text x="20" y="742" fill="#93c5fd" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">[6]&#160;A&#160;stage&#160;built&#160;on&#160;another:&#160;ENTRYPOINT&#160;empties&#160;the&#160;CMD&#160;it&#160;inherited</text>
<text x="20" y="760" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;answer:&#160;wrong&#160;(2&#160;claims&#160;checked,&#160;0&#160;hold,&#160;2&#160;wrong)</text>
<text x="20" y="778" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;XX&#160;Setting&#160;ENTRYPOINT&#160;empties&#160;a&#160;CMD&#160;inherited&#160;from&#160;the&#160;base&#160;image;&#160;set&#160;CMD&#160;again&#160;in&#160;the&#160;same&#160;stage.</text>
<text x="20" y="796" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;XX&#160;`docker&#160;run&#160;web`&#160;does&#160;not&#160;run&#160;`tini&#160;--&#160;node&#160;server.js`:&#160;it&#160;runs&#160;`tini&#160;--`&#160;(an&#160;ENTRYPOINT&#160;empties&#160;the&#160;CMD&#160;the&#160;stage&#160;inherited&#160;unless&#160;the&#160;stage&#160;sets</text>
<text x="20" y="814" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;CMD&#160;itself).</text>
