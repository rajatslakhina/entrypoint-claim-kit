<text x="20" y="850" fill="#93c5fd" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">[7]&#160;A&#160;base&#160;image&#160;the&#160;Dockerfile&#160;does&#160;not&#160;show:&#160;quiet&#160;when&#160;the&#160;Dockerfile&#160;agrees</text>
<text x="20" y="868" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;answer:&#160;verified&#160;(1&#160;claim&#160;checked,&#160;1&#160;hold)</text>
<text x="20" y="886" fill="#86efac" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;ok&#160;`docker&#160;run&#160;web`&#160;runs&#160;`node&#160;server.js`&#160;after&#160;the&#160;base&#160;image's&#160;ENTRYPOINT,&#160;if&#160;any,&#160;as&#160;the&#160;answer&#160;says.</text>
<text x="20" y="904" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;with&#160;an&#160;argument:&#160;wrong&#160;(1&#160;claim&#160;checked,&#160;0&#160;hold,&#160;1&#160;wrong)</text>
<text x="20" y="922" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;XX&#160;`docker&#160;run&#160;web&#160;--inspect`&#160;does&#160;not&#160;run&#160;`node&#160;server.js&#160;--inspect`:&#160;it&#160;runs&#160;`--inspect`&#160;after&#160;the&#160;base&#160;image's&#160;ENTRYPOINT,&#160;if&#160;any&#160;(arguments&#160;after</text>
<text x="20" y="940" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;the&#160;image&#160;replace&#160;CMD;&#160;they&#160;are&#160;not&#160;added&#160;to&#160;it).</text>
