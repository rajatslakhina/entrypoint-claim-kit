<text x="20" y="508" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;XX&#160;`docker&#160;run&#160;web`&#160;does&#160;not&#160;run&#160;`node&#160;server.js&#160;--port&#160;3000`:&#160;it&#160;runs&#160;`/bin/sh&#160;-c&#160;&quot;node&#160;server.js&quot;&#160;--port&#160;3000`&#160;(a&#160;shell-form&#160;ENTRYPOINT&#160;runs&#160;`sh&#160;-c`</text>
<text x="20" y="526" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;with&#160;its&#160;text,&#160;which&#160;never&#160;uses&#160;CMD&#160;or&#160;the&#160;run's&#160;arguments).</text>
<text x="20" y="544" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;Dockerfile&#160;alone:&#160;wrong&#160;(1&#160;claim&#160;checked,&#160;0&#160;hold,&#160;1&#160;wrong)</text>
<text x="20" y="562" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;XX&#160;`ENTRYPOINT&#160;node&#160;server.js`&#160;(line&#160;4)&#160;is&#160;a&#160;shell-form&#160;ENTRYPOINT,&#160;so&#160;the&#160;CMD&#160;never&#160;reaches&#160;the&#160;program:&#160;the&#160;container&#160;runs&#160;`/bin/sh&#160;-c&#160;&quot;node</text>
